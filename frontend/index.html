<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UserVault — Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <div class="split-layout">

    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-vault"></i></div>
        <h1>UserVault</h1>
        <p>Secure. Smart. Simple.</p>
      </div>
      <div class="left-features">
        <div class="feature"><i class="fa-solid fa-shield-halved"></i><span>JWT Authentication</span></div>
        <div class="feature"><i class="fa-solid fa-rotate-left"></i><span>Smart Data Recovery</span></div>
        <div class="feature"><i class="fa-solid fa-users"></i><span>Full User Management</span></div>
      </div>
      <div class="left-glow"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <div class="form-box">

        <!-- TABS -->
        <div class="tabs">
          <button class="tab active" id="loginTab" onclick="switchTab('login')">Login</button>
          <button class="tab" id="registerTab" onclick="switchTab('register')">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="auth-form">
          <h2>Welcome Back</h2>
          <p class="sub">Sign in to your account</p>

          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="loginEmail" placeholder="Email address" required />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="Password" required />
            <i class="fa-solid fa-eye toggle-pass" onclick="togglePassword('loginPassword')"></i>
          </div>

          <div id="loginError" class="error-msg"></div>

          <button type="submit" class="btn-primary">
            <span>Sign In</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="auth-form hidden">
          <h2>Create Account</h2>
          <p class="sub">Join UserVault today</p>

          <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="regName" placeholder="Full name" required />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="regEmail" placeholder="Email address" required />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="regPassword" placeholder="Password" required />
            <i class="fa-solid fa-eye toggle-pass" onclick="togglePassword('regPassword')"></i>
          </div>

          <div id="registerError" class="error-msg"></div>
          <div id="registerSuccess" class="success-msg"></div>

          <button type="submit" class="btn-primary">
            <span>Create Account</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
